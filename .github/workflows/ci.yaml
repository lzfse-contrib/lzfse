name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            install_cmd: sudo apt-get update && sudo apt-get install -y meson ninja-build
            exe_ext: ''
            install_prefix: sudo
            configure_suffix: ''

          - name: Ubuntu / Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            install_cmd: sudo apt-get update && sudo apt-get install -y meson ninja-build
            exe_ext: ''
            install_prefix: sudo
            configure_suffix: ''

          - name: macOS / Clang
            os: macos-latest
            cc: clang
            cxx: clang++
            install_cmd: brew install meson ninja
            exe_ext: ''
            install_prefix: sudo
            configure_suffix: ''

          - name: Windows / MSVC
            os: windows-latest
            cc: cl
            cxx: cl
            install_cmd: pip install meson ninja
            exe_ext: '.exe'
            install_prefix: ''
            configure_suffix: '--vsenv -Ddefault_library=static'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: ${{ matrix.install_cmd }}

      - name: Configure with Meson
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          meson setup build --buildtype=release ${{ matrix.configure_suffix }}

      - name: Compile with Meson
        run: |
          meson compile -C build

      - name: Verify Binary Execution
        run: |
          ./build/lzfse${{ matrix.exe_ext }} --help || true

      - name: Test Installation
        run: |
          ${{ matrix.install_prefix }} meson install -C build
